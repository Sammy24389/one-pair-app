apply plugin: 'com.android.application'

def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def versionCore = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/)
if (!versionCore.matches()) throw new GradleException("Invalid package version: ${appVersion}")
def versionParts = (1..3).collect { versionCore.group(it) as int }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

android {
    buildFeatures { aidl = true }
    sourceSets.main.aidl.srcDirs = []
    namespace = "app.onepair.p2p"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        def partnerTest = project.findProperty('onepairTestBuild') == 'true'
        applicationId(partnerTest ? "app.onepair.p2p.openpigeontest" : "app.onepair.p2p")
        manifestPlaceholders = [appLabel: partnerTest ? "Padi OpenPigeon Test" : "@string/app_name",
                                activityLabel: partnerTest ? "Padi OpenPigeon Test" : "@string/title_activity_main"]
        minSdkVersion 26
        ndk { abiFilters 'arm64-v8a' }
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release CI may override these; local/debug builds use the same package version.
        versionCode((System.getenv("ONEPAIR_VERSION_CODE") ?: appVersionCode.toString()) as int)
        versionName(System.getenv("ONEPAIR_VERSION_NAME") ?: appVersion)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def ks = System.getenv("ONEPAIR_KEYSTORE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("ONEPAIR_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ONEPAIR_KEY_ALIAS")
                keyPassword System.getenv("ONEPAIR_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}


def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        def names = ['ONEPAIR_KEYSTORE', 'ONEPAIR_KEYSTORE_PASSWORD', 'ONEPAIR_KEY_ALIAS', 'ONEPAIR_KEY_PASSWORD']
        def missing = names.findAll { !System.getenv(it) }
        if (missing) throw new GradleException("Release signing is required. Missing: ${missing.join(', ')}")
        def keyFile = file(System.getenv('ONEPAIR_KEYSTORE'))
        if (!keyFile.isFile()) throw new GradleException('Release signing keystore does not exist.')
        def pinFile = rootProject.file('release-signing.sha256')
        if (!pinFile.isFile()) throw new GradleException('Missing permanent release certificate fingerprint.')
        def expected = pinFile.text.trim().toLowerCase()
        if (!(expected ==~ /[a-f0-9]{64}/)) throw new GradleException('Invalid release certificate fingerprint.')
        def certificate
        try {
            def keyStore = java.security.KeyStore.getInstance(keyFile, System.getenv('ONEPAIR_KEYSTORE_PASSWORD').toCharArray())
            def alias = System.getenv('ONEPAIR_KEY_ALIAS')
            if (!(keyStore.getKey(alias, System.getenv('ONEPAIR_KEY_PASSWORD').toCharArray()) instanceof java.security.PrivateKey)) {
                throw new Exception('Missing private key')
            }
            certificate = keyStore.getCertificate(alias)
            if (!certificate) throw new Exception('Missing certificate')
        } catch (Exception ignored) {
            throw new GradleException('Invalid release signing keystore, alias or password.')
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (actual != expected) throw new GradleException('Release certificate does not match the pinned permanent key.')
        logger.lifecycle('Permanent release certificate verified.')
    }
}
tasks.configureEach { if (name == 'preReleaseBuild') dependsOn(validateReleaseSigning) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':openpigeon')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
