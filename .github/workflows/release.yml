name: Release

# Push a tag like v1.2.0 → builds the Android APK + web app, publishes a GitHub Release
# with the matching CHANGELOG.md section attached as notes, and deploys the PWA to GitHub Pages.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.0.0'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Require permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Permanent Android signing is not configured ($variable missing)."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/padi-release.p12"
          echo "ONEPAIR_KEYSTORE=$RUNNER_TEMP/padi-release.p12" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: node scripts/check-version.mjs "$TAG"

      - name: Typecheck
        run: npm run typecheck

      - name: Web regression tests
        run: npm test

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/changelog.mjs "$TAG" > release-notes.md

      - name: Build PWA (GitHub Pages)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build --outDir dist-web

      - name: Build web bundle for Android
        run: npm run build:android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy 'tools' package no longer exists in the SDK repo.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        env:
          ONEPAIR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONEPAIR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONEPAIR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          MA="$(echo "$CORE" | cut -d. -f1)"
          MI="$(echo "$CORE" | cut -d. -f2)"
          PA="$(echo "$CORE" | cut -d. -f3)"
          export ONEPAIR_VERSION_NAME="$VERSION"
          export ONEPAIR_VERSION_CODE=$((MA * 10000 + MI * 100 + PA))
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify permanent APK certificate
        run: |
          mkdir -p out
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > out/signing-certificate.txt
          node scripts/verify-android-signature.mjs out/signing-certificate.txt

      - name: Collect artifacts
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/OnePair-$TAG.apk"
          (cd dist-web && zip -qr "../out/OnePair-$TAG-web.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt)
          {
            echo ""
            echo "---"
            echo "**Downloads**"
            echo "- \`OnePair-$TAG.apk\` - Android (sideload; allow installs from your browser/files app)"
            echo "- \`OnePair-$TAG-web.zip\` - self-hostable PWA"
            echo "- Web app: https://$OWNER.github.io/$REPO/"
          } >> release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: OnePair ${{ env.TAG }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            out/*.apk
            out/*.zip
            out/SHA256SUMS.txt
            out/signing-certificate.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/padi-release.p12"

  pages:
    name: Deploy PWA to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: "GitHub Actions". The release above is already published if this fails.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
